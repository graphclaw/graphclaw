[project]
name = "graphclaw"
version = "0.1.0"
description = "Graph-based task orchestration system"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.9.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
graphclaw = "graphclaw.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/graphclaw"]
