[project]
name = "graphclaw"
version = "0.2.0"
description = "Open-source graph-based task orchestration with AI agents"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "GraphClaw Contributors"}]
readme = "README.md"
keywords = ["task-management", "graph-database", "ai-agents", "orchestration", "apache-age"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = [
    "anthropic>=0.40.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.9.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "boto3>=1.35.0",
    "litellm>=1.50.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.34.0",
    "aiosmtplib>=3.0.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
    "authlib>=1.3.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.54.0",
    "tiktoken>=0.8.0",
]
# Phase 4: Connectors + MCP
connectors = [
    "google-auth>=2.28.0",
    "google-api-python-client>=2.120.0",
    "jira>=3.8.0",
    "asana>=5.0.0",
    "notion-client>=2.2.1",
    # Phase 4: MCP
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "anyio[trio]>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.13.0",
    "schemathesis>=3.27.0",
    "pyyaml>=6.0.0",
]
load-testing = [
    "locust>=2.20.0",
]
monitoring = [
    "watchtower>=3.0.0",
]
all = [
    "graphclaw[openai]",
    "graphclaw[connectors]",
    "graphclaw[load-testing]",
    "graphclaw[monitoring]",
]

[project.urls]
Homepage = "https://graphclaw.ai"
Repository = "https://github.com/abhishekgupta-myrepo/graphclaw"
Documentation = "https://graphclaw.ai/docs"
"Bug Tracker" = "https://github.com/abhishekgupta-myrepo/graphclaw/issues"
Changelog = "https://github.com/abhishekgupta-myrepo/graphclaw/blob/main/CHANGELOG.md"

[project.scripts]
graphclaw = "graphclaw.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/load", ".venv", "__pycache__", ".git"]

[tool.coverage.run]
source = ["src/graphclaw"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.hatch.build.targets.wheel]
packages = ["src/graphclaw"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module-level import not at top — occurs in files with __future__ + docstring ordering
    "F841",   # local variable assigned but never used — common in test scaffolding
    "UP042",  # str+Enum → StrEnum — valid pre-3.11 pattern; migration is out of scope
]

[tool.ruff.lint.isort]
known-first-party = ["graphclaw"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
