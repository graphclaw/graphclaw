services:
  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    environment:
      POSTGRES_DB: graphclaw
      POSTGRES_USER: graphclaw
      POSTGRES_PASSWORD: ${DB_PASSWORD:-graphclaw_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      default:
        aliases:
          - graph-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphclaw -d graphclaw"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: pgbouncer/pgbouncer:1.22
    environment:
      - DATABASES_HOST=graph-db
      - DATABASES_PORT=5432
      - DATABASES_DBNAME=graphclaw
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_DEFAULT_POOL_SIZE=10
      - PGBOUNCER_AUTH_TYPE=trust
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

  # Local dev: single node. Production: see infra/redis/ for 3-node cluster config
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: graphclaw
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-graphclaw_dev}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot service: creates the graphclaw bucket in MinIO on first run
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 graphclaw ${MINIO_PASSWORD:-graphclaw_dev} &&
        mc mb --ignore-existing local/graphclaw &&
        echo 'MinIO bucket ready'
      "
    restart: "no"

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: development
      DATABASE_URL: postgresql://graphclaw:${DB_PASSWORD:-graphclaw_dev}@db:5432/graphclaw
      SECRETS_BACKEND: env_file
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: graphclaw
      AWS_ACCESS_KEY_ID: graphclaw
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-graphclaw_dev}
      # Gateway channels
      GATEWAY_ENABLED_CHANNELS: ${GATEWAY_ENABLED_CHANNELS:-email}
      # Email channel
      GATEWAY_IMAP_HOST: ${GATEWAY_IMAP_HOST:-}
      GATEWAY_IMAP_PORT: ${GATEWAY_IMAP_PORT:-993}
      GATEWAY_IMAP_USER: ${GATEWAY_IMAP_USER:-}
      GATEWAY_IMAP_PASS: ${GATEWAY_IMAP_PASS:-}
      GATEWAY_IMAP_FOLDER: ${GATEWAY_IMAP_FOLDER:-INBOX}
      GATEWAY_IMAP_POLL_INTERVAL: ${GATEWAY_IMAP_POLL_INTERVAL:-60}
      GATEWAY_SMTP_HOST: ${GATEWAY_SMTP_HOST:-}
      GATEWAY_SMTP_PORT: ${GATEWAY_SMTP_PORT:-587}
      # Telegram channel
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USE_WEBHOOK: ${TELEGRAM_USE_WEBHOOK:-false}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-30}
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../infra:/app/infra
    entrypoint: ["python", "-m", "uvicorn"]
    command:
      - "graphclaw.gateway.server:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # For running tests or CLI commands (on-demand, not auto-started)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: development
      DATABASE_URL: postgresql://graphclaw:${DB_PASSWORD:-graphclaw_dev}@db:5432/graphclaw
      SECRETS_BACKEND: env_file
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: graphclaw
      AWS_ACCESS_KEY_ID: graphclaw
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-graphclaw_dev}
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../infra:/app/infra
    command: ["python", "-m", "pytest", "tests/", "--tb=short", "-q"]

volumes:
  pgdata:
  miniodata:
