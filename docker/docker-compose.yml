services:
  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    environment:
      POSTGRES_DB: graphclaw
      POSTGRES_USER: graphclaw
      POSTGRES_PASSWORD: ${DB_PASSWORD:-graphclaw_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Wave 0: mount grants.sql into the Postgres initdb scripts directory.
      # Runs automatically on first container start if the data dir is empty.
      - ../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      default:
        aliases:
          - graph-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphclaw -d graphclaw"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    environment:
      - DATABASES_HOST=graph-db
      - DATABASES_PORT=5432
      - DATABASES_DBNAME=graphclaw
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_DEFAULT_POOL_SIZE=10
      - PGBOUNCER_AUTH_TYPE=trust
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

  # Local dev: single node. Production: see infra/redis/ for 3-node cluster config
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: graphclaw
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-graphclaw_dev}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot service: creates the graphclaw bucket in MinIO and applies Wave 0 policies.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../infrastructure/minio/policies:/policies:ro
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 graphclaw ${MINIO_PASSWORD:-graphclaw_dev} &&
        mc mb --ignore-existing local/graphclaw &&
        mc anonymous set none local/graphclaw &&
        mc ilm rule list local/graphclaw 2>/dev/null | grep -q 'users/' &&
          echo 'WARNING: user-prefix lifecycle rules found — remove before enabling no-delete enforcement' ||
          echo 'MinIO lifecycle check passed: no user-prefix expiry rules' &&
        mc admin policy create local agent-policy /policies/agent-policy.json 2>/dev/null || true &&
        mc admin policy create local admin-policy /policies/admin-policy.json 2>/dev/null || true &&
        mc admin user add local agent_principal ${AGENT_PRINCIPAL_SECRET:-agent_secret_change_me} 2>/dev/null || true &&
        mc admin policy attach local agent-policy --user agent_principal 2>/dev/null || true &&
        mc admin user add local admin_principal ${ADMIN_PRINCIPAL_SECRET:-admin_secret_change_me} 2>/dev/null || true &&
        mc admin policy attach local admin-policy --user admin_principal 2>/dev/null || true &&
        echo 'MinIO bucket and Wave 0 policies ready'
      "
    restart: "no"

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8010:8000"
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: development
      DATABASE_URL: postgresql://graphclaw:${DB_PASSWORD:-graphclaw_dev}@db:5432/graphclaw
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_TRACE: ${LLM_TRACE:-false}
      LOG_SINKS: ${LOG_SINKS:-stdout,object_storage}
      # Wave 0: No-Delete principle — flag on after W0-PR1-PR9 all green
      GRAPHCLAW_NO_DELETE_ENFORCEMENT: ${GRAPHCLAW_NO_DELETE_ENFORCEMENT:-true}
      AGENT_PRINCIPAL_DSN: postgresql://agent_principal:${AGENT_PRINCIPAL_SECRET:-agent_secret_change_me}@db:5432/graphclaw
      ADMIN_PRINCIPAL_DSN: postgresql://admin_principal:${ADMIN_PRINCIPAL_SECRET:-admin_secret_change_me}@db:5432/graphclaw
      MIGRATION_PRINCIPAL_DSN: postgresql://migration_principal:${MIGRATION_PRINCIPAL_SECRET:-migration_secret_change_me}@db:5432/graphclaw
      SECRETS_BACKEND: env_file
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GRAPHCLAW_DEFAULT_LLM_PROVIDER: ${GRAPHCLAW_DEFAULT_LLM_PROVIDER:-anthropic}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: graphclaw
      AWS_ACCESS_KEY_ID: graphclaw
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-graphclaw_dev}
      # Gateway channels
      GATEWAY_ENABLED_CHANNELS: ${GATEWAY_ENABLED_CHANNELS:-email}
      # Email channel
      GATEWAY_IMAP_HOST: ${GATEWAY_IMAP_HOST:-}
      GATEWAY_IMAP_PORT: ${GATEWAY_IMAP_PORT:-993}
      GATEWAY_IMAP_USER: ${GATEWAY_IMAP_USER:-}
      GATEWAY_IMAP_PASS: ${GATEWAY_IMAP_PASS:-}
      GATEWAY_IMAP_FOLDER: ${GATEWAY_IMAP_FOLDER:-INBOX}
      GATEWAY_IMAP_POLL_INTERVAL: ${GATEWAY_IMAP_POLL_INTERVAL:-60}
      GATEWAY_SMTP_HOST: ${GATEWAY_SMTP_HOST:-}
      GATEWAY_SMTP_PORT: ${GATEWAY_SMTP_PORT:-587}
      # Telegram channel
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USE_WEBHOOK: ${TELEGRAM_USE_WEBHOOK:-false}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-30}
      # Intelligence pipeline
      GRAPHCLAW_USER_ID: ${GRAPHCLAW_USER_ID:-}
      # Tiered memory / context compaction (see graphclaw.config.MemoryConfig).
      # Compose carries production defaults; the host .env may override with lower
      # test values to trigger compaction quickly during validation.
      GRAPHCLAW_MEMORY_BUDGET_CHARS: ${GRAPHCLAW_MEMORY_BUDGET_CHARS:-80000}
      GRAPHCLAW_MEMORY_WORKING_CHAR_CAP: ${GRAPHCLAW_MEMORY_WORKING_CHAR_CAP:-8000}
      GRAPHCLAW_MEMORY_COMPACT_THRESHOLD_PCT: ${GRAPHCLAW_MEMORY_COMPACT_THRESHOLD_PCT:-60}
      GRAPHCLAW_MEMORY_WINDOW_SIZE: ${GRAPHCLAW_MEMORY_WINDOW_SIZE:-20}
      GRAPHCLAW_MEMORY_SUMMARY_THRESHOLD: ${GRAPHCLAW_MEMORY_SUMMARY_THRESHOLD:-30}
      GRAPHCLAW_MEMORY_BUDGET_TOKENS: ${GRAPHCLAW_MEMORY_BUDGET_TOKENS:-80000}
      GRAPHCLAW_MEMORY_HISTORY_MAX: ${GRAPHCLAW_MEMORY_HISTORY_MAX:-200}
      GRAPHCLAW_DISTILLATION_MODEL: ${GRAPHCLAW_DISTILLATION_MODEL:-claude-haiku-4-5}
      GRAPHCLAW_MEMORY_DISTILL_MAX_CHARS: ${GRAPHCLAW_MEMORY_DISTILL_MAX_CHARS:-1500}
      GRAPHCLAW_MEMORY_INTELLIGENCE_MAX_WORDS: ${GRAPHCLAW_MEMORY_INTELLIGENCE_MAX_WORDS:-500}
      # OAuth 2.0
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8010}
      OAUTH_REDIRECT_ALLOWLIST: ${OAUTH_REDIRECT_ALLOWLIST:-http://localhost:8010}
      COCKPIT_BASE_URL: ${COCKPIT_BASE_URL:-http://localhost:3000}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../infra:/app/infra
    entrypoint: ["python", "-m", "uvicorn"]
    command:
      - "graphclaw.gateway.server:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # For running tests or CLI commands (on-demand, not auto-started)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: development
      DATABASE_URL: postgresql://graphclaw:${DB_PASSWORD:-graphclaw_dev}@db:5432/graphclaw
      SECRETS_BACKEND: env_file
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GRAPHCLAW_DEFAULT_LLM_PROVIDER: ${GRAPHCLAW_DEFAULT_LLM_PROVIDER:-anthropic}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: graphclaw
      AWS_ACCESS_KEY_ID: graphclaw
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-graphclaw_dev}
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../infra:/app/infra
    command: ["python", "-m", "pytest", "tests/", "--tb=short", "-q"]

volumes:
  pgdata:
  miniodata:
