name: Nightly Agent Evals

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:      # Also triggerable manually

env:
  PYTHON_VERSION: "3.12"

jobs:
  agent-evals:
    name: Full Agent Eval Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: apache/age:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: graphclaw
          POSTGRES_DB: graphclaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Run init-db.sql
        run: psql postgresql://postgres:graphclaw@localhost:5432/graphclaw -f scripts/init-db.sql
        continue-on-error: true

      - name: Run full agent eval suite
        run: |
          pytest tests/agent_evals \
            --run-evals \
            -v \
            --tb=short \
            --timeout=120 \
            --json-report \
            --json-report-file=tests/agent_evals/reports/nightly_$(date +%Y%m%d).json \
            -q
        env:
          DATABASE_URL: postgresql://postgres:graphclaw@localhost:5432/graphclaw
          TEST_DATABASE_URL: postgresql://postgres:graphclaw@localhost:5432/graphclaw
          REDIS_URL: redis://localhost:6379/0
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECRETS_BACKEND: env_file

      - name: Upload eval report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-eval-report-${{ github.run_id }}
          path: tests/agent_evals/reports/
          retention-days: 30

  # Canary subset — runs on PRs touching agent/skills/llm code
  agent-eval-canary:
    name: Agent Eval Canary (PR)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.changed_files, 'src/agent/') ||
        contains(github.event.pull_request.changed_files, 'src/skills/') ||
        contains(github.event.pull_request.changed_files, 'src/llm/') ||
        contains(github.event.pull_request.changed_files, 'tests/agent_evals/prompts/')
      )
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run canary evals
        run: |
          pytest tests/agent_evals \
            --run-evals \
            -m eval_canary \
            -v \
            --tb=short \
            --timeout=60 \
            -q
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECRETS_BACKEND: env_file
