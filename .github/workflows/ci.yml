name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lint deps
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests (no DB)
        run: |
          pytest tests/ \
            --ignore=tests/test_db \
            --ignore=tests/test_load \
            --ignore=tests/load \
            -x -q \
            --tb=short \
            --timeout=30
        env:
          SECRETS_BACKEND: env_file
          JWT_PRIVATE_KEY: ""
          JWT_PUBLIC_KEY: ""

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit security scan
        # Exclude migrations (generated SQL), AGE helpers, and Cypher query builders
        # (B608 false positives — graph_name/eid are internal constants, not user input)
        run: bandit -r src/ -ll -x src/graphclaw/migrations/,src/graphclaw/db/age/,src/graphclaw/db/queries/ --quiet
