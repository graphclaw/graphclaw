name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lint deps
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests (no DB)
        run: |
          pytest tests/ \
            --ignore=tests/test_db \
            --ignore=tests/test_load \
            --ignore=tests/load \
            -x -q \
            --tb=short \
            --timeout=30
        env:
          SECRETS_BACKEND: env_file
          JWT_PRIVATE_KEY: ""
          JWT_PUBLIC_KEY: ""

  test-integration:
    name: Integration Tests (with Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: apache/age:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: graphclaw
          POSTGRES_DB: graphclaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
      - name: Run init-db.sql
        run: psql postgresql://postgres:graphclaw@localhost:5432/graphclaw -f scripts/init-db.sql
      - name: Run integration tests
        run: pytest tests/test_db/ -x -q --tb=short --timeout=60
        env:
          DATABASE_URL: postgresql://postgres:graphclaw@localhost:5432/graphclaw
          REDIS_URL: redis://localhost:6379/0
          SECRETS_BACKEND: env_file

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit security scan
        # Exclude migrations (generated SQL), AGE helpers, and Cypher query builders
        # (B608 false positives — graph_name/eid are internal constants, not user input)
        run: bandit -r src/ -ll -x src/graphclaw/migrations/,src/graphclaw/db/age/,src/graphclaw/db/queries/ --quiet
