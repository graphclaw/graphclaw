# Conventional PR Title — blocks merge if the PR title does not follow
# Conventional Commits (feat: / fix: / chore: / docs: / etc.).
# Since we squash-merge, the PR title becomes the commit message that
# release-please parses. A non-conventional title silently breaks release notes.
name: conventional-title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - ready_for_review
      - reopened

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Lint PR title
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            build
            ci
            chore
            style
            refactor
            test
          requireScope: false
          subjectPattern: ^[A-Za-z0-9].+$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}" must start with
            an alphanumeric character.
