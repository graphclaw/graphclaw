name: Integration Tests (On-Demand)

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test-integration:
    name: Integration Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    services:
      postgres:
        image: apache/age:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: graphclaw
          POSTGRES_DB: graphclaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
      - name: Run init-db.sql
        run: psql postgresql://postgres:graphclaw@localhost:5432/graphclaw -f scripts/init-db.sql
      - name: Run integration tests
        run: pytest tests/test_db/ -x -q --tb=short --timeout=60
        env:
          DATABASE_URL: postgresql://postgres:graphclaw@localhost:5432/graphclaw
          TEST_DATABASE_URL: postgresql://postgres:graphclaw@localhost:5432/graphclaw
          REDIS_URL: redis://localhost:6379/0
          SECRETS_BACKEND: env_file